<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>주는교회 40주년</title>
    <style>
        /* 기본 리셋 및 전체 화면 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            font-family: 'Malgun Gothic', '맑은 고딕', sans-serif;
            overflow: hidden; /* 스크롤 방지 */
        }

        /* 4. 배경 이미지 및 컨테이너 설정 (구글 드라이브 연동) */
        .background-container {
            width: 100%;
            height: 100%;
            /* [중요] 아래 id= 뒤에 있는 텍스트를 구글 드라이브 파일 ID로 변경하세요.
               예: id=1aBcD_eFgHiJkL-MnOpQrStUvWxYz
            */
            background-image: url('https://drive.google.com/uc?export=view&id=여기에_구글드라이브_파일ID를_넣으세요'); 
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 3 & 4. 텍스트 송출 공간 (따옴표 사이 위치) */
        .text-display-area {
            position: absolute;
            top: 45%; /* 배경 이미지에 맞게 세로 위치 조절 (40%~50% 권장) */
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            text-align: center;
            opacity: 1;
            transition: opacity 0.5s ease-in-out; /* 페이드 효과 */
        }
        
        .display-text {
            font-size: 3rem; 
            color: #ffffff;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5); 
            white-space: nowrap;
        }

        .cursor {
            font-size: 3rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% { opacity: 0; }
        }

        /* 1 & 2. 하단 입력 섹션 */
        .input-section {
            position: absolute;
            bottom: 5%; 
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            padding: 20px;
        }

        .input-label {
            color: #ffffff;
            font-size: 0.9rem;
            margin-bottom: 8px;
            display: block;
        }

        .input-group {
            display: flex;
            gap: 10px;
        }

        .text-input {
            flex: 1;
            padding: 10px 15px;
            font-size: 1rem;
            color: #ffffff;
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 5px;
            outline: none;
        }
        
        .text-input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .submit-btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            color: #333;
            background-color: #ffffff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2
